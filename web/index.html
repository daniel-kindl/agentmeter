<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>agentmeter</title>
    <link rel="preload" href="/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header>
      <div>
        <h1>agentmeter</h1>
        <p class="subtitle">Claude Code and Codex usage, measured on this machine.</p>
      </div>
      <nav aria-label="Usage range">
        <button data-range="7d">7 days</button>
        <button data-range="30d" class="active">30 days</button>
        <button data-range="all">All time</button>
      </nav>
    </header>
    <main>
      <section id="limits" class="limits" aria-label="Usage limits" hidden></section>
      <p id="status" role="status">Loading local usage…</p>
      <section id="dashboard" hidden>
        <dl class="totals" aria-label="Usage totals">
          <div><dt id="input-total">—</dt><dd>Input tokens</dd></div>
          <div><dt id="output-total">—</dt><dd>Output tokens</dd></div>
          <div><dt id="cache-read-total">—</dt><dd>Cache read tokens</dd></div>
          <div><dt id="cost-total">—</dt><dd>Estimated cost</dd></div>
        </dl>
        <p id="pricing-warning" class="warning" hidden></p>
        <section class="panel">
          <div class="panel-heading">
            <h2>Tokens over time</h2>
            <span id="timezone" class="timezone"></span>
          </div>
          <svg id="chart" viewBox="0 0 900 280" role="img" aria-label="Daily token usage chart"></svg>
        </section>
        <div class="tables">
          <section class="panel">
            <div class="panel-heading"><h2>By agent</h2></div>
            <table><thead><tr><th>Source</th><th>Tokens</th><th>Cost</th></tr></thead><tbody id="source-rows"></tbody></table>
          </section>
          <section class="panel">
            <div class="panel-heading"><h2>By model</h2></div>
            <table><thead><tr><th>Model</th><th>Tokens</th><th>Cost</th></tr></thead><tbody id="model-rows"></tbody></table>
          </section>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
