<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>agentmeter</title>
    <link rel="preload" href="/fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <!--
      This page is read from about two metres, on a second monitor, by someone whose hands are
      busy elsewhere. It answers one question without being touched: how much headroom is left,
      and when does it come back. The limits open the page at full width; history, cost and the
      per-agent tables sit below them as reference.
      Everything else follows from that distance. Plain neutral dark surfaces, one step of
      elevation, hairlines instead of shadow, sentence-case labels at readable sizes, and the
      percentage as the only large element. Colour is spent on status, never on decoration.
    -->
    <header class="topbar">
      <span class="topbar-mark">agentmeter</span>
      <span id="timezone" class="topbar-zone"></span>
      <span id="live-mount"></span>
    </header>
    <main>
      <section id="limits" aria-label="Usage limits" hidden></section>
      <p id="status" role="status">Reading local session logs…</p>
      <section id="dashboard" hidden>
        <dl class="readouts" aria-label="Usage totals">
          <div><dt>Input</dt><dd id="input-total">—</dd></div>
          <div><dt>Output</dt><dd id="output-total">—</dd></div>
          <div><dt>Cache read</dt><dd id="cache-read-total">—</dd></div>
          <div><dt>Cost</dt><dd id="cost-total">—</dd></div>
        </dl>
        <p id="pricing-warning" class="notice" hidden></p>
        <div class="stack">
          <section class="card">
            <header class="card-head">
              <h2>Daily usage</h2>
              <nav aria-label="Usage range">
                <button data-range="7d">7d</button>
                <button data-range="30d" class="active">30d</button>
                <button data-range="all">All</button>
              </nav>
            </header>
            <div id="chart" class="chart" role="img" aria-label="Daily token usage"></div>
          </section>
          <div class="logs">
            <section class="card">
              <header class="card-head"><h2>By agent</h2></header>
              <div class="table-wrap">
                <table><thead><tr><th>Source</th><th>Tokens</th><th>Cost</th></tr></thead><tbody id="source-rows"></tbody></table>
              </div>
            </section>
            <section class="card">
              <header class="card-head"><h2>By model</h2></header>
              <div class="table-wrap">
                <table><thead><tr><th>Model</th><th>Tokens</th><th>Cost</th></tr></thead><tbody id="model-rows"></tbody></table>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
