version: 2

project_name: agentmeter

builds:
  - id: agentmeter
    main: ./cmd/agentmeter
    binary: agentmeter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: agentmeter
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Launchers sit beside the binary so the archive has a one-step entry point
    # that needs no terminal: agentmeter up scans, serves, and opens the browser.
    files:
      - src: scripts/agentmeter-up.cmd
        dst: agentmeter-up.cmd
      - src: scripts/agentmeter-up.sh
        dst: agentmeter-up.sh
        info:
          mode: 0o755
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

